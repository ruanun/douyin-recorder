# 服务端（无图形界面）部署
#
#   cp .env.example .env && 修改令牌（或直接编辑 .env）
#   docker compose up -d
#
# 浏览器访问 http://<主机>:8787/?token=<令牌>
# 录制文件、数据库、日志都保存在 ./data

services:
  douyin-recorder:
    # 本地构建用默认镜像名；想直接用 GHCR 镜像时在 .env 里设置：
    #   DOUYIN_RECORDER_IMAGE=ghcr.io/ruanun/douyin-recorder:latest
    # 并执行 `docker compose pull && docker compose up -d --no-build`
    image: "${DOUYIN_RECORDER_IMAGE:-douyin-recorder-server:latest}"
    build: .
    container_name: douyin-recorder
    restart: unless-stopped
    # 以宿主机用户身份运行，录像/数据库/日志的属主就是你自己（默认 1000）。
    user: "${PUID:-1000}:${PGID:-1000}"
    ports:
      - "8787:8787"
    environment:
      DOUYIN_RECORDER_TOKEN: "${DOUYIN_RECORDER_TOKEN:?请在 .env 中设置 DOUYIN_RECORDER_TOKEN}"
      DOUYIN_RECORDER_HOME: /data
      TZ: "${TZ:-Asia/Shanghai}"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
