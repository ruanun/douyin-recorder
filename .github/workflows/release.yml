name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)build assets for, e.g. v0.2.0'
        required: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FFMPEG_LINUX: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
  FFMPEG_WINDOWS: https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip

jobs:
  # Create the draft release once so every build job can upload straight to it.
  # This avoids moving hundreds of megabytes between jobs, which repeatedly
  # failed at the artifact-download step.
  prepare:
    name: Prepare draft release
    runs-on: ubuntu-latest
    steps:
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft \
              --title "$TAG" --generate-notes

  linux-desktop:
    name: Linux desktop bundles
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf protobuf-compiler
      - name: Fetch FFmpeg sidecar
        run: |
          mkdir -p src-tauri/binaries
          curl -sSL "$FFMPEG_LINUX" -o /tmp/ffmpeg.tar.xz
          tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
          cp /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg \
             src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
          chmod +x src-tauri/binaries/ffmpeg-x86_64-unknown-linux-gnu
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build bundles
        run: npx tauri build --bundles deb,rpm,appimage
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd target/release/bundle
          sha256sum deb/*.deb rpm/*.rpm appimage/*.AppImage > SHA256SUMS-linux-desktop.txt
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            deb/*.deb rpm/*.rpm appimage/*.AppImage SHA256SUMS-linux-desktop.txt

  windows-desktop:
    name: Windows desktop installer
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install protoc
        run: choco install protoc -y
      - name: Fetch FFmpeg sidecar
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries | Out-Null
          Invoke-WebRequest -Uri $env:FFMPEG_WINDOWS -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-extract
          $bin = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $bin.FullName src-tauri/binaries/ffmpeg-x86_64-pc-windows-msvc.exe
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Build installers
        run: npx tauri build
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem target/release/bundle/nsis/*.exe, target/release/bundle/msi/*.msi -ErrorAction SilentlyContinue
          if (-not $files) { Write-Error 'no installers produced'; exit 1 }
          $sums = $files | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $sums | Set-Content SHA256SUMS-windows-desktop.txt
          gh release upload "$env:GITHUB_REF_NAME" --repo "$env:GITHUB_REPOSITORY" --clobber @($files.FullName) SHA256SUMS-windows-desktop.txt

  server:
    name: Headless server tarball
    needs: prepare
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server -> target
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: cargo build --release -p douyin-recorder-server
      - name: Package tarball
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          mkdir -p dist-release
          cp target/release/douyin-recorder-server dist-release/
          cp deploy/douyin-recorder.service dist-release/ 2>/dev/null || true
          cp .env.example dist-release/ 2>/dev/null || true
          cp README.md dist-release/ 2>/dev/null || true
          tar -C dist-release -czf "douyin-recorder-server-${VERSION}-linux-x86_64.tar.gz" .
          sha256sum "douyin-recorder-server-${VERSION}-linux-x86_64.tar.gz" \
            > "SHA256SUMS-server.txt"
      - name: Upload to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            douyin-recorder-server-*.tar.gz SHA256SUMS-server.txt

  docker:
    name: Docker image (GHCR)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish:
    name: Publish release
    needs: [linux-desktop, windows-desktop, server]
    if: startsWith(github.ref, 'refs/tags/') && needs.linux-desktop.result == 'success' && needs.windows-desktop.result == 'success' && needs.server.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
