[package]
name = "douyin-recorder-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Douyin live stream & danmaku recording core (no UI dependencies)"

[lib]
name = "douyin_recorder_core"
path = "src/lib.rs"

[build-dependencies]
prost-build = "0.14.4"

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
chrono.workspace = true
tempfile.workspace = true
semver.workspace = true

reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled", "backup"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-webpki-roots"] }
prost = "0.14.4"
flate2 = "1.1.10"
md-5 = "0.11.0"
rand = "0.10.3"
futures-util = "0.3.34"
rustls = { version = "0.23.46", features = ["ring"] }
quick-xml = "0.37"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
